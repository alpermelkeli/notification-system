# Scrapes every notifier replica (ADR-0009). Compose's DNS returns one A record per replica of a
# service, so `--scale worker=3` is picked up without changing this file.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 10s

  - job_name: dispatcher
    dns_sd_configs:
      - names: [dispatcher]
        type: A
        port: 9090
        refresh_interval: 10s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9090
        refresh_interval: 10s
