# Load balancer in front of the API replicas (ADR-0008).
# Docker's DNS returns one address per replica of the `api` service and nginx round-robins across
# them. The upstream is re-resolved every few seconds (`resolve`, nginx >= 1.27.3), so replicas
# added or removed with `docker compose up --scale api=N` are picked up without a restart.
#
# One worker process keeps round-robin visibly even for the scaling demo; production uses a
# managed load balancer.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  resolver 127.0.0.11 valid=5s ipv6=off; # Docker's embedded DNS

  upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 32;
  }

  # WebSocket upgrade passthrough (B-4).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    client_max_body_size 2m; # batch create: up to 1000 notifications

    location / {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h; # long-lived WebSocket connections
      proxy_next_upstream error timeout http_502 http_503;
    }

    # Metrics are scraped from each replica directly, never through the public entry point.
    location = /metrics {
      return 404;
    }

    location = /lb/health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
