# Local stack: one command brings up infrastructure, the notifier roles and an nginx LB (D-3).
#
#   docker compose up --build
#   docker compose up --build --scale api=3 --scale worker=3   # scaling demo (ADR-0008)
#
# Host ports: 8080 API (via lb); bound to 127.0.0.1 only: 8081 mock provider, 5432 PostgreSQL,
# 9092 Kafka, 6379 Redis. Stop local PostgreSQL/Redis installs first if they use these ports.

name: notification-system

x-app: &app
  build: .
  image: notification-system:local
  restart: unless-stopped
  # Longer than SHUTDOWN_TIMEOUT (15s) so graceful shutdown finishes before Docker sends SIGKILL.
  stop_grace_period: 20s
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: .env
      required: false
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: json
    DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
    KAFKA_BROKERS: kafka:29092
    REDIS_ADDR: redis:6379

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data # default is /tmp/kafka-logs, outside the volume
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes: [./deploy/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local stand-in for webhook.site, with fault injection (ADR-0006).
  mockprovider:
    <<: *app
    entrypoint: ["mockprovider"]
    command: []
    environment:
      MOCK_LATENCY: ${MOCK_LATENCY:-50ms}
      MOCK_LATENCY_JITTER: ${MOCK_LATENCY_JITTER:-100ms}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_RATE_LIMIT_RATE: ${MOCK_RATE_LIMIT_RATE:-0}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-1s}
    ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      test: ["CMD", "notifier", "healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- notifier roles
  # One-shot job: schema migrations and initial partitions. The roles below wait for it.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "notifier", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  dispatcher:
    <<: *app
    command: ["dispatcher"]
    deploy:
      replicas: 2 # HA; replicas coordinate through FOR UPDATE SKIP LOCKED (ADR-0003)
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "notifier", "healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      mockprovider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "notifier", "healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  lb:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes: [./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
