openapi: 3.1.0
info:
  title: Notification System API
  version: 1.0.0
  summary: Event-driven multi-channel (SMS, email, push) notification service.
  description: |
    Notifications are accepted asynchronously: a create request stores the notification and
    returns `202 Accepted`; delivery happens in the background at most 100 messages per second
    per channel, high priority first. Poll `GET /v1/notifications/{id}` (or the batch) for the
    status.

    **Status lifecycle:** `pending → queued → processing → sent`, with `retrying` between
    attempts and `failed` / `cancelled` as other terminal states. A failed notification can be
    replayed (`POST /v1/notifications/{id}/retry`).

    **Idempotency:** send an `Idempotency-Key` header on create requests. Repeating a request
    with the same key and body returns the original resource with `Idempotent-Replayed: true`;
    the same key with a different body is rejected with `409 idempotency_key_reused`. Keys are
    remembered for 72 hours by default.

    **Correlation:** every response carries `X-Correlation-ID` (taken from the request when it is
    1–128 characters of `[A-Za-z0-9._-]`, otherwise generated) and `X-Instance-ID` (the API replica
    that served it). Reads may come from a replica and be slightly stale.

    **Errors** always use the envelope `{"error": {"code", "message", "details"}}`.

    **Request bodies** are decoded strictly: unknown fields and trailing data are rejected. As in
    most JSON decoders, field names match case-insensitively and an explicit `null` is treated
    like an omitted field.

    **Timeouts:** every request is bounded (10 s by default). A timed-out request returns
    `503 timeout`; retrying a create with the same `Idempotency-Key` is safe.

    **Authentication** is out of scope for this service: it is meant to run behind an API gateway
    that authenticates internal callers (hence `security: []`).
servers:
  - url: http://localhost:8080
    description: docker-compose (nginx load balancer)
security: []
tags:
  - name: notifications
    description: Create, inspect, cancel and replay individual notifications.
  - name: batches
    description: Create up to 1000 notifications at once and follow their progress.
  - name: templates
    description: Message templates with `{{variable}}` placeholders, rendered when a notification is created.
  - name: live
    description: Real-time status updates over WebSocket.
  - name: operations
    description: Liveness and readiness probes.
paths:
  /v1/notifications:
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Create a notification
      description: |
        Stores the notification as `pending` and returns immediately (FR-1.1). The content is
        either given as `content` or rendered from a template (`templateId` and `variables`); a
        rendered text must meet the same channel limits.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRequest' }
            examples:
              otp:
                summary: High-priority OTP over SMS
                value: { recipient: '+905551234567', channel: sms, content: 'Your code is 482913', priority: high }
              scheduled:
                summary: Scheduled email
                value: { recipient: user@example.com, channel: email, content: 'Your weekly summary', scheduledAt: '2026-11-22T09:00:00Z' }
              template:
                summary: From a template
                value: { recipient: '+905551234567', templateId: 01a1fd17-4a0b-7869-8fa8-a36f9d5fb75a, variables: { order_id: A-42 } }
      responses:
        '202':
          description: Accepted (or replayed, see `Idempotent-Replayed`).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List notifications
      description: |
        Newest first, filtered and paginated with an opaque cursor (FR-1.5). Pass `nextCursor`
        from the previous page as `cursor`; it is absent on the last page.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - name: createdFrom
          in: query
          description: Inclusive lower bound on `createdAt` (RFC 3339; encode `+` in an offset as `%2B`, or use `Z`). Must be before `createdTo`.
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          description: Exclusive upper bound on `createdAt` (RFC 3339; encode `+` as `%2B`).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/notifications/batch:
    post:
      tags: [batches]
      operationId: createBatch
      summary: Create up to 1000 notifications
      description: |
        All items are validated first; if any item is invalid the whole batch is rejected with
        every violation listed (`notifications[i].field`). Accepted batches are stored in one
        transaction (FR-1.2).

        Items may carry their own `idempotencyKey`. An item whose key was already used with the
        same content is not created again: the existing notification is returned for that
        position with `duplicate: true` and is not counted in the batch total.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBatchRequest' }
            example:
              notifications:
                - { recipient: '+905551234567', channel: sms, content: 'Flash sale starts now', priority: low }
                - { recipient: user@example.com, channel: email, content: 'Flash sale starts now', priority: low, idempotencyKey: campaign-42-user-7 }
      responses:
        '202':
          description: Accepted (or replayed, see `Idempotent-Replayed`).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/notifications/{id}:
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Get a notification and its status
      parameters: [{ $ref: '#/components/parameters/NotificationID' }]
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/notifications/{id}/history:
    get:
      tags: [notifications]
      operationId: getNotificationHistory
      summary: Get the status history of a notification
      parameters: [{ $ref: '#/components/parameters/NotificationID' }]
      responses:
        '200':
          description: Every status change, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/History' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/notifications/{id}/cancel:
    post:
      tags: [notifications]
      operationId: cancelNotification
      summary: Cancel a notification that has not been sent yet
      description: |
        Allowed while the notification is `pending`, `queued` or `retrying` (FR-1.4). A
        notification that is being sent right now (`processing`) or is finished cannot be
        cancelled (`409 invalid_state`).
      parameters: [{ $ref: '#/components/parameters/NotificationID' }]
      responses:
        '200':
          description: The cancelled notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/notifications/{id}/retry:
    post:
      tags: [notifications]
      operationId: retryNotification
      summary: Replay a failed notification
      description: Resets a `failed` notification to `pending` with a fresh attempt budget.
      parameters: [{ $ref: '#/components/parameters/NotificationID' }]
      responses:
        '202':
          description: The notification, pending again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/batches/{id}:
    get:
      tags: [batches]
      operationId: getBatch
      summary: Get a batch with per-status counts
      description: |
        List the batch's notifications with `GET /v1/notifications?batchId={id}` (FR-1.3).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/templates:
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template
      description: |
        Placeholders are `{{ name }}`, where a name is a letter or `_` followed by letters, digits
        or `_`; at most 50 distinct variables. The body as written must meet the channel's content
        limits. Names are unique.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateRequest' }
            example: { name: order_shipped, channel: sms, body: 'Your order {{order_id}} has shipped.' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      description: Newest first, paginated with an opaque cursor like the notification list.
      parameters:
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/templates/{id}:
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Get a template
      parameters: [{ $ref: '#/components/parameters/TemplateID' }]
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: Replace a template's name and body
      description: |
        Increments `version`. The channel cannot change. Notifications already created from the
        template keep the content they were rendered with.
      parameters: [{ $ref: '#/components/parameters/TemplateID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateRequest' }
      responses:
        '200':
          description: The updated template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete a template
      description: Notifications created from it are not affected.
      parameters: [{ $ref: '#/components/parameters/TemplateID' }]
      responses:
        '204':
          description: Deleted.
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Timeout' }
  /v1/ws:
    get:
      tags: [live]
      operationId: statusStream
      summary: Live status updates (WebSocket)
      description: |
        Upgrade to a WebSocket and follow notifications and batches as they change (B-4). Messages
        are JSON text frames. A live demo runs at `/ws-demo`.

        **Client → server**
        - `{"type":"subscribe","notificationIds":["…"],"batchIds":["…"]}`: 1–100 ids per message, at
          most 1000 per connection (a batch counts as one).
        - `{"type":"unsubscribe","notificationIds":["…"],"batchIds":["…"]}`

        **Server → client**
        - `{"type":"subscribed","notificationIds":[…],"batchIds":[…]}`: the full set after every
          subscribe or unsubscribe.
        - `{"type":"status","event":StatusEvent,"snapshot":true}`: right after a subscribe, the
          current status of each new notification id.
        - `{"type":"batch","batch":{"id","createdAt","total","statusCounts"}}`: right after a
          subscribe, the counts of each new batch id.
        - `{"type":"status","event":StatusEvent}`: every later status change of a followed
          notification, or of any notification of a followed batch.
        - `{"type":"error","code","message","id"}`: codes `bad_request`, `invalid_id`, `not_found`
          (the id is not kept), `too_many_subscriptions`, `snapshot_failed`, `rate_limited` (at most
          10 messages per second are handled). The connection stays open.

        Updates are best effort and may arrive out of order: keep the event with the latest `at`
        per notification, and read the REST API when in doubt. On reconnect, subscribe again and
        the snapshots fill the gap.

        Close codes: `1001` server shutting down (reconnect), `1003` binary frame, `1008` client too
        slow (more than 256 events behind), `1009` message over 64 KiB, `1013` instance full (try
        again). Browsers must connect from the API's own origin or one listed in `WS_ALLOWED_ORIGINS`.
        Failed upgrades (403, 426) are answered in plain text by the WebSocket library, not with the
        error envelope.
      responses:
        '101':
          description: Switching to the WebSocket protocol. Messages follow the description above; events use the StatusEvent schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEvent' }
        '403':
          description: A browser connected from an origin that is not allowed (plain text).
        '404': { $ref: '#/components/responses/NotFound' }
        '426':
          description: The request was not a WebSocket upgrade (plain text).
  /healthz:
    get:
      tags: [operations]
      operationId: liveness
      summary: Liveness (never checks dependencies)
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /readyz:
    get:
      tags: [operations]
      operationId: readiness
      summary: Readiness (checks PostgreSQL)
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 1–255 printable ASCII characters; see the idempotency section above.
      schema: { type: string, minLength: 1, maxLength: 255 }
    NotificationID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    Location:
      description: URL of the created resource.
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` when the response replays an earlier request with the same Idempotency-Key.'
      schema: { type: string, enum: ['true'] }
    CorrelationID:
      description: Correlation id of the request, also stored on created notifications.
      schema: { type: string }
  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      description: '`high` is never overtaken; `normal` and `low` age so they cannot starve.'
    Status:
      type: string
      enum: [pending, queued, processing, retrying, sent, failed, cancelled]
    CreateNotificationRequest:
      allOf: [{ $ref: '#/components/schemas/NotificationFields' }]
      unevaluatedProperties: false
    NotificationFields:
      type: object
      required: [recipient]
      description: Give either `channel` and `content`, or `templateId` (with `variables`).
      oneOf:
        - required: [channel, content]
        - required: [templateId]
      properties:
        recipient:
          type: string
          description: |
            `sms`: E.164 phone number (`+905551234567`). `email`: a bare address. `push`: a device
            token (8–4096 printable ASCII characters).
        channel:
          allOf: [{ $ref: '#/components/schemas/Channel' }]
          description: Optional with `templateId` (the template's channel is used); if given, it must match it.
        content:
          type: string
          description: |
            `sms`: at most 10 segments (1530 GSM-7 characters, or 670 when the text needs UCS-2,
            e.g. because of `ş`/`ı`). `email`: at most 64 KiB. `push`: at most 4 KiB. Must be
            omitted with `templateId`.
        templateId:
          type: string
          format: uuid
          description: Render the content from this template (B-3). The rendered text must meet the limits above.
        variables:
          type: object
          maxProperties: 50
          additionalProperties: { type: string }
          description: |
            Values for the template's placeholders. Every placeholder needs a value and every value
            must belong to a placeholder (`variables.<name>` violations otherwise). Values are
            inserted as they are, never expanded.
          example: { order_id: A-42 }
        priority:
          allOf: [{ $ref: '#/components/schemas/Priority' }]
          default: normal
        scheduledAt:
          type: string
          format: date-time
          description: |
            Deliver at or after this time; at most 7 days ahead by default. A time in the past
            means "as soon as possible", so an idempotent retry still works after the original
            schedule has passed.
    BatchItemRequest:
      allOf:
        - $ref: '#/components/schemas/NotificationFields'
        - type: object
          properties:
            idempotencyKey:
              type: string
              minLength: 1
              maxLength: 255
              description: Per-item key; must be unique within the batch.
      unevaluatedProperties: false
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/BatchItemRequest' }
    Notification:
      type: object
      required: [id, channel, priority, recipient, content, status, attempts, nextAttemptAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: 'UUIDv7; ids sort by creation time.' }
        batchId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        priority: { $ref: '#/components/schemas/Priority' }
        recipient: { type: string }
        content: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        attempts: { type: integer, minimum: 0, description: Delivery attempts made so far. }
        nextAttemptAt: { type: string, format: date-time }
        scheduledAt: { type: string, format: date-time }
        queuedAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        providerMessageId: { type: string }
        lastError: { type: string }
        correlationId: { type: string }
        templateId: { type: string, format: uuid, description: The template the content was rendered from. }
        templateVersion: { type: integer, minimum: 1, description: The template version the content was rendered from. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: string }
    StatusChange:
      type: object
      required: [to, attempt, at]
      properties:
        from: { $ref: '#/components/schemas/Status' }
        to: { $ref: '#/components/schemas/Status' }
        attempt: { type: integer }
        reason: { type: string }
        at: { type: string, format: date-time }
    History:
      type: object
      required: [id, changes]
      properties:
        id: { type: string, format: uuid }
        changes:
          type: array
          items: { $ref: '#/components/schemas/StatusChange' }
    Batch:
      type: object
      required: [id, createdAt, total, statusCounts]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        total: { type: integer, description: Notifications created by this batch (duplicates excluded). }
        correlationId: { type: string }
        statusCounts:
          type: object
          description: Number of the batch's notifications in each status.
          additionalProperties: { type: integer }
          example: { pending: 120, sent: 878, failed: 2 }
    BatchItemResult:
      type: object
      required: [index, duplicate, notification]
      properties:
        index: { type: integer, description: Position in the request. }
        duplicate: { type: boolean }
        notification: { $ref: '#/components/schemas/Notification' }
    BatchCreated:
      type: object
      required: [batch, items]
      properties:
        batch: { $ref: '#/components/schemas/Batch' }
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchItemResult' }
    TemplateRequest:
      type: object
      additionalProperties: false
      required: [name, channel, body]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_.-]{0,99}$'
        channel: { $ref: '#/components/schemas/Channel' }
        body:
          type: string
          description: Text with `{{ name }}` placeholders; every `{{` must open a well-formed placeholder.
    Template:
      type: object
      required: [id, name, channel, body, variables, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        body: { type: string }
        variables:
          type: array
          items: { type: string }
          description: The placeholders of the body, in order of first use.
        version: { type: integer, minimum: 1, description: Starts at 1 and goes up on every update. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        nextCursor: { type: string }
    StatusEvent:
      type: object
      description: |
        One status change (ADR-0011). `at` is the database time of the transition; keep the latest
        per notification. Never carries the recipient or the content.
      required: [notificationId, channel, priority, status, attempts, at]
      properties:
        notificationId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time, description: 'Set while `pending` or `retrying`.' }
        lastError: { type: string, description: 'Set when `retrying` or `failed`.' }
        at: { type: string, format: date-time }
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: 'notifications[3].recipient' }
        message: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - not_found
                - method_not_allowed
                - invalid_state
                - idempotency_key_reused
                - already_exists
                - payload_too_large
                - unsupported_media_type
                - timeout
                - internal_error
            message: { type: string }
            details:
              type: array
              description: Field violations for `validation_failed`, the current status for `invalid_state`.
              items:
                anyOf:
                  - $ref: '#/components/schemas/FieldViolation'
                  - type: object
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
  responses:
    BadRequest:
      description: Malformed JSON, unknown fields or invalid query parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request is well-formed but violates a rule; `details` lists every violation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_failed
              message: request validation failed
              details:
                - { field: recipient, message: 'must be an E.164 phone number, e.g. +905551234567' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidState:
      description: The notification is not in a status that allows this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_state
              message: 'notification is sent; this operation needs one of: pending, queued, retrying'
              details: [{ currentStatus: sent }]
    IdempotencyConflict:
      description: |
        The Idempotency-Key (or, in a batch, an item's `idempotencyKey`) was already used with a
        different request. For an item, `details` names it (`notifications[i].idempotencyKey`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AlreadyExists:
      description: A template with this name already exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The request body exceeds the limit (256 KiB single, 10 MiB batch).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The body must be `application/json`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Timeout:
      description: The request did not finish within the server's time limit; safe to retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Unexpected server error; the correlation id identifies it in the logs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
