name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true # newest 1.26.x patch, not exactly 1.26.0
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml

  test:
    runs-on: ubuntu-latest # Docker is available for testcontainers-based integration tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true # newest 1.26.x patch, not exactly 1.26.0
      - name: Test (race detector, coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: notification-system:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate docker-compose
        run: docker compose config -q
